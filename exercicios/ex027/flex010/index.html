<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: blue;
            display: flex;
            flex-flow: row nowrap;


        }

        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            flex: auto;

        }

        div#item1 {
            /*flex-basis: 150px;
              flex-grow: 1;          
              flex-shrink: 0;*/

            flex: 1 0 150px;
        }

        div#item2 {
            flex-basis: 150px;
            flex-grow: 2;
            flex-shrink: 0;

        
        }

        div#item3 {
            flex-basis: 150px;
            flex-grow: 1;
            flex-shrink: 2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item" id="item1">A</div>
        <div class="item" id="item2">B</div>
        <div class="item" id="item3">C</div>

    </div>

</body>

</html>
