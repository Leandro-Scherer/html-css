<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilos/style.css">

<body>
    <main>
        <section id="login">
            <div id="imagem">

                <!--Aqui vai a Imagem-->

            </div>
            <div id="formulario">

                <h1>Login</h1>
                <p>seja bem-vindo(a) novamente.Faca login para acessar e poder fazer as configuracoes no seu ambiente.
                </p>

            </div>
            <form action="login.php" method="post">

                <div class="campo">
                    <span class="material-symbols-outlined">
                        person
                    </span>

                </div>
                <div class="campo">
                    <span class="material-symbols-outlined">
                        vpn_key
                    </span>
                    <input type="password" name="senha" id="isenha" placeholder="Sua senha" autocomplete="current-password" max-lenght="30">
                    <label for="isenha">Senha</label>
                </div>
                <input type="submit" value="Entrar" id="ientrar" minlength="8" maxlength="20">
                <a href="esqueci.html">
                    Esqueci a senha <span class="material-symbols-outlined">mail</span>
                </a>










            </form>



        </section>


    </main>
